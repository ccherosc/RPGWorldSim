name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Pinned to a major rather than "lts/*": the publish runs unattended and
      # the world hash is only meaningful if the engine under it stays put.
      # 26 is what the village is developed on, and Vitest 5 refuses anything
      # older than 22.12.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # The five acceptance checks, run as a separate step so a determinism
      # regression is visible in the job list without opening the test output.
      #
      # The cross-platform half of the guarantee lives in the golden-value
      # tests (packages/sim-core/test/golden.test.ts), which pin actual RNG
      # output and hashes. Those run on Linux here and on whatever the
      # developer uses locally, so a divergence between platforms or between
      # V8 versions fails the build rather than going unnoticed.
      - name: Determinism
        run: npm run verify
